name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project if it was uploaded as a zip
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z" -d unpacked; done || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          S=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$S" ]; then
            echo "settings.gradle.kts not found. Repo contents:"
            ls -R | head -80
            exit 1
          fi
          echo "Android project found in: $(dirname "$S")"
          cd "$(dirname "$S")"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dot-debug-apk
          path: "**/app-debug.apk"
